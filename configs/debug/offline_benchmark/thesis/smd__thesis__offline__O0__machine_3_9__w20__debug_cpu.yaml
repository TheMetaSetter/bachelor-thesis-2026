experiment_name: smd__thesis__offline__direct_branch_routing__machine_3_9__w20__debug_cpu
seed: 6
experiment_variant: direct_branch_routing_debug_cpu_v1
device: cpu
output_dir: outputs/benchmark_smoke/smd/thesis_direct_branch_routing/machine_3_9/seed6/debug_cpu
checkpoint_dir: outputs/benchmark_smoke/smd/thesis_direct_branch_routing/machine_3_9/seed6/debug_cpu/checkpoints
data_config_path: configs/data/smd_benchmark_machine_3_9_window20.yaml
model_config_path: configs/model/thesis_multitask_two_stage_window20.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_benchmark_fixed_synth.yaml
# Debug starts from a fresh model because the historical Stage-B checkpoint is
# not present in this local checkout. The trainer initializes memories from the
# small clean training slice before the first Stage-B step.
model_overrides:
  training_phase: stage_b_fusion_finetuning
  fusion_mode: direct_branch_routing
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 1
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 2
evaluation:
  vus_max_buffer_size: 10
  vus_num_thresholds: 20
  retention_policy: retain_for_eda
logging:
  use_wandb: false
  wandb_project: bachelor-thesis-2026
  wandb_mode: disabled
  wandb_run_name: smd__thesis__offline__direct_branch_routing__machine_3_9__w20__debug_cpu
  log_hard_prediction_ratio: false
  log_row_normalized_confusion_matrix: false
  enable_reconstruction_diagnostics: true
  diagnostics_include_grad_norm: true
  diagnostics_log_interval_steps: 1
  diagnostics_stages_for_classification:
    - train
    - val_synth
data_overrides:
  batch_size: 2
  num_workers: 0
  max_train_windows: 4
  max_val_windows: 4
  max_test_windows: 4
