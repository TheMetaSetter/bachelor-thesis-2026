score_space: raw_input
point_score_transform: identity
offline_threshold_split: validation
online_threshold_split: validation
offline_threshold_quantile: 0.99
online_threshold_quantile: 0.99
adaptation_threshold_split: null
triage:
  window_quantile: 0.99
  latent_low_quantile: 0.75
  latent_high_quantile: 0.99
metrics:
- segment_mean_vus_pr
- segment_mean_vus_roc
- segment_mean_affiliation_f1
- fpr
vus_max_buffer_size: 20
vus_num_thresholds: 200
fpr_budgets:
- 0.001
- 0.005
- 0.01
uncertainty_fields:
- point_anomaly_score_variance
- window_anomaly_score_variance
- continuous_retrieval_variance_point
- continuous_retrieval_variance_window
- discrete_retrieval_variance_point
- discrete_retrieval_variance_window
- reconstruction_variance_point
- reconstruction_variance_window
- reconstruction_variance_full
- classification_probability_variance
- classification_variance_mean
uncertainty_statistics:
- mean
- std
- min
- p50
- p95
- max
test_label_usage: metrics_only
point_adjustment: false
calibration_label_policy: exclude_known_anomalies
ewma_current_weight: 0.9
ewma_previous_weight: 0.1
online_reporting_score: last_ewma_estimate
offline_point_threshold_source: synthetic_validation_normal
