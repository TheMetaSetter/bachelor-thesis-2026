task_name: multitask_tsad
use_synthetic_augmentation: true
use_synthetic_validation: true
synthetic_validation_seed: 7
classification_label_mode: redlamp_multiclass
freeze_fusion_for_epochs: 0
warmup_alpha_value: 0.5
warmup_beta_value: 0.5
# When train_balance_classes is true, anomaly_probability does not control
# class balance across the 12 synthetic anomaly classes. The injector samples
# those classes evenly within batch and anomaly_probability only controls how
# often windows are selected for anomaly injection.
anomaly_probability: 0.5
train_balance_classes: true
val_realistic: true
val_realistic_source: test_same_scope
val_anomaly_rate_override: null
min_segment_fraction: 0.2
max_segment_fraction: 0.3
spike_scale: 3.0
anomaly_visibility_boost: 1.5
anomaly_families:
  - spike
  - flip
  - speedup
  - noise
  - cutoff
  - average
  - scale
  - wander
  - contextual
  - upsidedown
  - mixture
