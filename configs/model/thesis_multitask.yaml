model_name: thesis_multitask
input_dim: 38
encoder_dim: 64
hidden_dim: 32
num_classes: 2
dropout: 0.1
continuous_enabled: true
continuous_num_prototypes: 8
discrete_enabled: true
discrete_codebook_size: 16
gumbel_temperature: 1.5
temperature_start: 1.5
temperature_end: 0.7
temperature_anneal_fraction: 0.8
alpha_logit_init: 0.0
beta_logit_init: 0.0
# Default thesis starting objective: L_recon + lambda_cls * L_cls.
# Keep all extra regularizers off at the beginning and enable them only after
# concrete observed failure modes justify them.
lambda_cls: 1.0
lambda_div: 0.0
lambda_var: 0.0
lambda_cov: 0.0
lambda_use: 0.0
lambda_gate: 0.0
variance_floor_gamma: 1.0
gate_barrier_margin: 0.25
