model_name: thesis_multitask
enable_classification_path: true
input_dim: 38
window_size: 20
encoder_dim: 64
hidden_dim: 32
encoder_family: cnn_simple
mlp_num_linear_layers: 3
cnn_num_layers: 3
cnn_kernel_size: 3
cnn_hidden_channels: 64
cnn_dropout: 0.1
num_classes: 12
dropout: 0.1
continuous_enabled: true
continuous_num_prototypes: 16
discrete_enabled: true
discrete_codebook_size: 60
stochastic_inference: true
monte_carlo_samples: 10
continuous_temperature: 0.9
discrete_temperature: 0.9
variance_correction: 1
return_mc_samples: true
sample_retention_policy: retain_for_eda
gumbel_temperature: 1.5
temperature_start: 1.5
temperature_end: 0.7
temperature_anneal_fraction: 0.8
temperature_hold_fraction: 0.0
alpha_logit_init: 0.0
beta_logit_init: 0.0
use_label_refurbishment: true
refurbishment_alpha: 0.1
refurbishment_beta: 0.01
reconstruction_normal_only: true
lambda_recon: 0.9
lambda_cls: 0.1
lambda_div: 0.0
lambda_var: 0.0
lambda_cov: 0.0
lambda_use: 0.0
lambda_gate: 0.0
usage_lambda_start: 0.0
usage_lambda_end: 0.0
usage_lambda_schedule_fraction: 1.0
variance_floor_gamma: 1.0
gate_barrier_margin: 0.25
enable_two_view_contrastive: true
contrastive_temperature: 0.1
lambda_contrastive: 0.1
enable_cka_gated_fusion: false
cka_eps: 1.0e-6
bootstrap_encoder_epochs: 0
discrete_ema_decay: 0.99
memory_norm_epsilon: 1.0e-6
memory_initialization_batches: 16
memory_initialization_with_synthetic_windows: true
training_phase: multitask_pretraining
fusion_mode: task_specific_concat_projection
discrete_query_mode: cosine_topk
discrete_topk: 3
discrete_query_temperature: 0.1
freeze_memories_after_initialization: true
freeze_recovered_zipped_encoder_during_warmup: true
discrete_memory_label_source: synthetic_train_labels
