# group: smoke
# stage: general
# status: active
# owner: redlamp_baseline
# tags: [anomaly_archive, staffiii, w20, seed11, smoke]

experiment_name: anomaly_archive_redlamp_baseline_staffiii_window20
seed: 11
device: cpu
output_dir: outputs/anomaly_archive_redlamp_baseline_staffiii_window20
checkpoint_dir: outputs/anomaly_archive_redlamp_baseline_staffiii_window20/checkpoints
data_config_path: configs/data/anomaly_archive_staffiii.yaml
model_config_path: configs/model/redlamp_baseline.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20.yaml

model_overrides:
  input_dim: 1
  latent_dim: 32
  classifier_dim: 16
  cnn_hidden_channels: 16

data_overrides:
  batch_size: 16
  num_workers: 0
  max_train_windows: 32
  max_val_windows: 16
  max_test_windows: 16

optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: reduce_on_plateau
    monitor_metric: val_synth_vus_pr
    factor: 0.5
    patience: 5
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-6

checkpoint_monitor_metric: val_synth_vus_pr
epochs: 1

evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 200

logging:
  use_wandb: false
  wandb_project: bachelor-thesis-2026
  wandb_mode: disabled
  wandb_tags:
    - anomaly_archive
    - staffiii
    - redlamp_multiclass
    - window20
    - smoke
  wandb_run_name: anomaly_archive_redlamp_baseline_staffiii_window20_smoke
