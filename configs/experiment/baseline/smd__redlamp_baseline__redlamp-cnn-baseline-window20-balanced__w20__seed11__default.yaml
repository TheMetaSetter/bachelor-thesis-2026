# group: baseline
# stage: general
# status: active
# owner: redlamp_cnn_baseline
# tags: [smd, w20, seed11, default, val_synth, cnn_simple, balanced_classes]

experiment_name: smd_redlamp_cnn_baseline_window20_balanced
seed: 11
device: cuda
output_dir: outputs/smd_redlamp_cnn_baseline_window20_balanced
checkpoint_dir: outputs/smd_redlamp_cnn_baseline_window20_balanced/checkpoints
data_config_path: configs/data/smd_rtx3090_machine_2_1_20.yaml
model_config_path: configs/model/redlamp_cnn_baseline.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_balanced.yaml
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: reduce_on_plateau
    monitor_metric: val_synth_vus_pr
    factor: 0.5
    patience: 15
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-6
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 300
evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 200
logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_mode: online
  wandb_tags:
    - smd
    - redlamp_multiclass
    - window20
    - cnn_simple
    - balanced_classes
  wandb_run_name: smd_redlamp_cnn_baseline_window20_balanced
