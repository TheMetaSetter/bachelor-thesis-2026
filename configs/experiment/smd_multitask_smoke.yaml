experiment_name: smd_multitask_smoke
seed: 7
device: cpu
output_dir: outputs/smd_multitask_smoke
checkpoint_dir: outputs/smd_multitask_smoke/checkpoints
data_config_path: configs/data/smd_smoke.yaml
model_config_path: configs/model/thesis_multitask.yaml
task_config_path: configs/task/multitask_tsad.yaml
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 5
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 1
logging:
  use_wandb: false
  wandb_project: bachelor-thesis-2026
  wandb_entity: null
  wandb_mode: disabled
  wandb_tags:
    - smd
    - multitask
    - smoke
  wandb_run_name: smd_multitask_smoke
