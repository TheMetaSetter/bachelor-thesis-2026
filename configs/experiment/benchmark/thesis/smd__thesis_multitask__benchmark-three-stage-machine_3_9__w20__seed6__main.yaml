# group: benchmark/thesis
# stage: three-stage

experiment_name: smd_benchmark_thesis_multitask_three_stage_machine_3_9_seed6
seed: 6
device: cuda
output_dir: outputs/benchmark/smd/thesis_multitask/machine_3_9/seed6
checkpoint_dir: outputs/benchmark/smd/thesis_multitask/machine_3_9/seed6/checkpoints
data_config_path: configs/data/smd_benchmark_machine_3_9_window20.yaml
model_config_path: configs/model/thesis_multitask_three_stage_comparative_smd.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_benchmark_fixed_synth.yaml
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 5
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 100
evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 200
logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_mode: online
  wandb_tags:
    - benchmark
    - thesis-three-stage
    - smd
    - machine-3-9
    - window20
    - seed6
    - val-synth
  wandb_run_name: smd_benchmark_thesis_multitask_three_stage_machine_3_9_seed6
three_stage:
  expected_total_training_epochs: 100
  stage1_classification_epochs: 15
  stage1_reconstruction_epochs: 25
  stage2_recovery_epochs: 5
  stage3_memory_initialization_and_fusion_warmup_epochs: 5
  multitask_pretraining_epochs: 50
  discrete_memory_label_source: synthetic_train_labels
  freeze_memories_after_initialization: true
  freeze_recovered_zipped_encoder_during_warmup: true
