# group: benchmark/thesis
# stage: two-stage

experiment_name: smd_benchmark_thesis_multitask_two_stage_point_score_machine_1_6_seed8
seed: 8
experiment_variant: two_stage_point_score_supervised_v1
device: cuda
output_dir: outputs/benchmark/smd/thesis_multitask_point_score/machine_1_6/seed8
checkpoint_dir: outputs/benchmark/smd/thesis_multitask_point_score/machine_1_6/seed8/checkpoints
data_config_path: configs/data/smd_benchmark_machine_1_6_window20.yaml
model_config_path: configs/model/thesis_multitask_two_stage_point_score_window20.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_benchmark_fixed_synth.yaml
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 5
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 100
evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 200
logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_mode: online
  wandb_tags:
    - benchmark
    - thesis-two-stage
    - thesis-point-score-supervised
    - smd
    - machine-1-6
    - window20
    - seed8
    - val-synth
  wandb_run_name: smd_benchmark_thesis_multitask_two_stage_point_score_machine_1_6_seed8
  log_hard_prediction_ratio: true
  log_row_normalized_confusion_matrix: true
  diagnostics_stages_for_classification:
    - train
    - val_synth
two_stage:
  expected_total_training_epochs: 100
  stage_a_multitask_epochs: 80
  stage_b_fusion_finetuning_epochs: 20
  discrete_memory_label_source: synthetic_train_labels
  freeze_encoder_and_memories_in_stage_b: true
