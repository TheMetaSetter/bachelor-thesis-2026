experiment_name: smd_multitask_100ep
seed: 7
device: cuda
output_dir: outputs/smd_multitask_100ep
checkpoint_dir: outputs/smd_multitask_100ep/checkpoints
data_config_path: configs/data/smd.yaml
model_config_path: configs/model/thesis_multitask.yaml
task_config_path: configs/task/multitask_tsad.yaml
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 5
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 100
logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_entity: themetasetter-i-h-c-qu-c-gia-tp-hcm
  wandb_mode: online
  wandb_tags:
    - smd
    - multitask
    - offline
    - 100ep
  wandb_run_name: smd_multitask_100ep
