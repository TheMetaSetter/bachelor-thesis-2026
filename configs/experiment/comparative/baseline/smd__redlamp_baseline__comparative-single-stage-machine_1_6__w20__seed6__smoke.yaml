# group: comparative/baseline
# stage: single-stage
# status: smoke
# owner: redlamp_baseline

experiment_name: smd_comparative_redlamp_baseline_single_stage_machine_1_6_smoke_seed6
seed: 6
device: cuda
output_dir: outputs/comparative/smd_smoke/redlamp_baseline/machine_1_6/seed6
checkpoint_dir: outputs/comparative/smd_smoke/redlamp_baseline/machine_1_6/seed6/checkpoints
data_config_path: configs/data/smd_rtx3090_machine_1_6_20_stride1.yaml
model_config_path: configs/model/redlamp_baseline_comparative_smd.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_comparative.yaml
data_overrides:
  batch_size: 32
  num_workers: 0
  max_train_windows: 64
  max_val_windows: 32
  max_test_windows: 64
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 1
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 3
evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 50
logging:
  use_wandb: false
  wandb_mode: disabled
  wandb_tags:
    - comparative
    - baseline-single-stage
    - smd
    - machine-1-6
    - smoke
  wandb_run_name: smd_comparative_redlamp_baseline_single_stage_machine_1_6_smoke_seed6
