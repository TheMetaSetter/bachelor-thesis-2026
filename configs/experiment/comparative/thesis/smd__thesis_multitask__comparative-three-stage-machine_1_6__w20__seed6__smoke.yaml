# group: comparative/thesis
# stage: three-stage
# status: smoke
# owner: thesis_multitask

experiment_name: smd_comparative_thesis_multitask_three_stage_machine_1_6_smoke_seed6
seed: 6
device: cpu
output_dir: outputs/comparative/smd_smoke/thesis_multitask/machine_1_6/seed6
checkpoint_dir: outputs/comparative/smd_smoke/thesis_multitask/machine_1_6/seed6/checkpoints
data_config_path: configs/data/smd_rtx3090_machine_1_6_20_stride1.yaml
model_config_path: configs/model/thesis_multitask_three_stage_comparative_smd.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_comparative.yaml
data_overrides:
  batch_size: 32
  num_workers: 0
  max_train_windows: 64
  max_val_windows: 32
  max_test_windows: 64
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 1
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_realistic_vus_pr
epochs: 5
evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 50
logging:
  use_wandb: false
  wandb_mode: disabled
  wandb_tags:
    - comparative
    - thesis-three-stage
    - smd
    - machine-1-6
    - smoke
  wandb_run_name: smd_comparative_thesis_multitask_three_stage_machine_1_6_smoke_seed6
three_stage:
  expected_total_training_epochs: 5
  stage1_classification_epochs: 1
  stage1_reconstruction_epochs: 1
  stage2_recovery_epochs: 1
  stage3_memory_initialization_and_fusion_warmup_epochs: 1
  multitask_pretraining_epochs: 1
  discrete_memory_label_source: synthetic_train_labels
  freeze_memories_after_initialization: true
  freeze_recovered_zipped_encoder_during_warmup: true
