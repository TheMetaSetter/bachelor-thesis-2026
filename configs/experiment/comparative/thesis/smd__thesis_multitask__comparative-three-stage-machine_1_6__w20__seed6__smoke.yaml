# group: comparative/thesis
# stage: two-stage
# status: smoke
# owner: thesis_multitask

experiment_name: smd_comparative_thesis_multitask_two_stage_machine_1_6_smoke_seed6
seed: 6
device: cpu
output_dir: outputs/comparative/smd_smoke/thesis_multitask/machine_1_6/seed6
checkpoint_dir: outputs/comparative/smd_smoke/thesis_multitask/machine_1_6/seed6/checkpoints
data_config_path: configs/data/smd_rtx3090_machine_1_6_20_stride1.yaml
model_config_path: configs/model/thesis_multitask_two_stage_comparative_smd.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_comparative.yaml
data_overrides:
  batch_size: 32
  num_workers: 0
  max_train_windows: 64
  max_val_windows: 32
  max_test_windows: 64
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 1
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 5
evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 50
logging:
  use_wandb: false
  wandb_mode: disabled
  wandb_tags:
    - comparative
    - thesis-two-stage
    - smd
    - machine-1-6
    - smoke
  wandb_run_name: smd_comparative_thesis_multitask_two_stage_machine_1_6_smoke_seed6
two_stage:
  expected_total_training_epochs: 30
  stage_a_multitask_epochs: 25
  stage_b_fusion_finetuning_epochs: 5
  discrete_memory_label_source: synthetic_train_labels
  freeze_encoder_and_memories_in_stage_b: true
