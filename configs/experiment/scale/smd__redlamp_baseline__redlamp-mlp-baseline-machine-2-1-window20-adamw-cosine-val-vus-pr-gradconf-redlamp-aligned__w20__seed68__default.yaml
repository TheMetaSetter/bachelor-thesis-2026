# group: scale
# stage: general
# status: active
# owner: redlamp_baseline
# tags: [smd, w20, seed68, default, val_synth, redlamp_aligned]

experiment_name: smd_redlamp_baseline_machine_2_1_window20_adamw_cosine_val_vus_pr_gradconf_redlamp_aligned
seed: 68
device: cuda
output_dir: outputs/smd_redlamp_baseline_machine_2_1_window20_adamw_cosine_val_vus_pr_gradconf_redlamp_aligned
checkpoint_dir: outputs/smd_redlamp_baseline_machine_2_1_window20_adamw_cosine_val_vus_pr_gradconf_redlamp_aligned/checkpoints
data_config_path: configs/data/smd_rtx3090_machine_2_1_20.yaml
model_config_path: configs/model/redlamp_baseline_redlamp_aligned.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_redlamp_aligned.yaml

model_overrides:
  enable_gradient_conflict_profiling: true
  gradient_profiling_scope: encoder_all
  gradient_focus_layer_name: encoder_last_linear
  gradient_log_every_n_steps: 1
  gradient_ema_alpha: 0.1
  gradient_sma_window: 50
  gradient_profile_include_bias: false

optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: reduce_on_plateau
    monitor_metric: val_synth_vus_pr
    factor: 0.5
    patience: 15
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-6

checkpoint_monitor_metric: val_synth_vus_pr
epochs: 300

evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 200

logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_mode: online
  wandb_tags:
    - smd
    - redlamp_multiclass
    - window20
    - mlp-depth-3
    - adamw
    - reduce-on-plateau
    - val-vus-pr
    - gradient-conflict-profiling
    - redlamp-aligned
  wandb_run_name: smd_redlamp_baseline_machine_2_1_window20_adamw_cosine_val_vus_pr_gradconf_redlamp_aligned
