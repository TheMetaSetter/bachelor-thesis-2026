# group: scale
# stage: general
# status: active
# owner: redlamp_mlp_baseline
# tags: [anomaly_archive, staffiii, w20, seed11, default, tsad, multitask, confmat]

experiment_name: anomaly_archive_redlamp_mlp_baseline_staffiii_window20_adamw_cosine_warmup10_vus_pr_confmat
seed: 11
device: cuda
output_dir: outputs/anomaly_archive_redlamp_mlp_baseline_staffiii_window20_adamw_cosine_warmup10_vus_pr_confmat
checkpoint_dir: outputs/anomaly_archive_redlamp_mlp_baseline_staffiii_window20_adamw_cosine_warmup10_vus_pr_confmat/checkpoints
data_config_path: configs/data/anomaly_archive_staffiii_full.yaml
model_config_path: configs/model/redlamp_mlp_baseline.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20.yaml

model_overrides:
  input_dim: 1

optimizer:
  optimizer_name: adamw
  learning_rate: 0.01
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 10
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true

checkpoint_monitor_metric: val_realistic_vus_pr
epochs: 300

evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 200

logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_mode: online
  wandb_tags:
    - anomaly_archive
    - staffiii
    - redlamp_multiclass
    - tsad
    - multitask
    - window20
    - input_dim_1
    - adamw
    - cosine
    - warmup10
    - val-vus-pr
    - confusion-matrix
  wandb_run_name: anomaly_archive_redlamp_mlp_baseline_staffiii_window20_adamw_cosine_warmup10_vus_pr_confmat
  log_row_normalized_confusion_matrix: true
  log_hard_prediction_ratio: true
  enable_reconstruction_diagnostics: true
  diagnostics_log_interval_steps: 100
  diagnostics_include_grad_norm: false
  diagnostics_stages_for_classification:
    - train
    - val
    - val_realistic
  focus_metrics:
    - train_loss
    - train_reconstruction_loss
    - train_classification_loss
    - train_classification_accuracy
    - val_loss
    - val_reconstruction_loss
    - val_classification_loss
    - val_classification_accuracy
    - val_realistic_loss
    - val_realistic_reconstruction_loss
    - val_realistic_classification_loss
    - val_realistic_classification_accuracy
    - val_realistic_vus_pr
    - val_realistic_roc_auc
    - val_realistic_pr_auc
    - val_realistic_threshold
  log_focused_metrics_jsonl: true
  focused_metrics_filename: focused_metrics_staffiii_redlamp_mlp_baseline.jsonl
