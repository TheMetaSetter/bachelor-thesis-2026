experiment_name: smd_thesis_multitask_redlamp_multiclass_window20_bootstrap50
seed: 11
device: cuda
output_dir: outputs/smd_thesis_multitask_redlamp_multiclass_window20_bootstrap50
checkpoint_dir: outputs/smd_thesis_multitask_redlamp_multiclass_window20_bootstrap50/checkpoints
data_config_path: configs/data/smd_rtx3090_machine_2_1_20.yaml
model_config_path: configs/model/thesis_multitask_redlamp_multiclass.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20.yaml
model_overrides:
  bootstrap_encoder_epochs: 50
optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0
  scheduler:
    scheduler_name: reduce_on_plateau
    monitor_metric: val_synth_loss
    factor: 0.5
    patience: 10
    threshold: 0.001
    threshold_mode: rel
    cooldown: 3
    min_lr: 1.0e-7
epochs: 300
evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 200
logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_mode: online
  wandb_tags:
    - smd
    - redlamp_multiclass
    - window20
    - mlp-depth-3
    - bootstrap-50
  wandb_run_name: smd_thesis_multitask_redlamp_multiclass_window20_bootstrap50
