experiment_name: smd_multitask_rtx3090_seed11_machine_2_1_window10_binary
seed: 11
device: cuda
output_dir: outputs/smd_multitask_rtx3090_seed11_machine_2_1_window10_binary
checkpoint_dir: outputs/smd_multitask_rtx3090_seed11_machine_2_1_window10_binary/checkpoints
data_config_path: configs/data/smd_rtx3090_machine_2_1_10.yaml
model_config_path: configs/model/thesis_multitask.yaml
task_config_path: configs/task/multitask_tsad_window10_binary.yaml
model_overrides:
  num_classes: 2
  temperature_hold_fraction: 0.15
  usage_lambda_start: 0.06
  usage_lambda_end: 0.03
  usage_lambda_schedule_fraction: 0.3
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  scheduler:
    scheduler_name: reduce_on_plateau
    monitor_metric: val_synth_pr_auc
    factor: 0.5
    patience: 10
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-6
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 300
