# group: benchmark_smoke/thesis
# stage: two-stage
# status: smoke
# owner: thesis_multitask

experiment_name: smd_benchmark_thesis_multitask_two_stage_machine_3_9_seed36_smoke
seed: 36
experiment_variant: two_stage_base_v1
device: cpu
output_dir: outputs/benchmark_smoke/smd/thesis_multitask/machine_3_9/seed36
checkpoint_dir: outputs/benchmark_smoke/smd/thesis_multitask/machine_3_9/seed36/checkpoints
data_config_path: configs/data/smd_benchmark_machine_3_9_window20.yaml
model_config_path: configs/model/thesis_multitask_two_stage_window20.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_benchmark_fixed_synth.yaml
data_overrides:
  batch_size: 8
  num_workers: 0
  max_train_windows: 16
  max_val_windows: 8
  max_test_windows: 16
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 1
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 2
evaluation:
  vus_max_buffer_size: 10
  vus_num_thresholds: 20
logging:
  use_wandb: false
  wandb_project: bachelor-thesis-2026
  wandb_mode: disabled
  wandb_tags:
    - benchmark
    - thesis-two-stage
    - smd
    - machine-3-9
    - smoke
  wandb_run_name: smd_benchmark_thesis_multitask_two_stage_machine_3_9_smoke_seed36
  log_hard_prediction_ratio: false
  log_row_normalized_confusion_matrix: false
  diagnostics_stages_for_classification:
    - train
    - val_synth
two_stage:
  expected_total_training_epochs: 2
  stage_a_multitask_epochs: 1
  stage_b_fusion_finetuning_epochs: 1
  discrete_memory_label_source: synthetic_train_labels
  freeze_encoder_and_memories_in_stage_b: true
