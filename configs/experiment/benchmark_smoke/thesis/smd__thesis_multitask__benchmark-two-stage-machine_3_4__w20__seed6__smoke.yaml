experiment_name: smd__thesis_multitask__benchmark-two-stage-machine_3_4__w20__seed6__smoke
seed: 6
experiment_variant: two_stage_base_v1
device: cuda
output_dir: outputs/benchmark_smoke/smd/thesis_multitask/machine_3_4/seed6
checkpoint_dir: outputs/benchmark_smoke/smd/thesis_multitask/machine_3_4/seed6/checkpoints
data_config_path: configs/data/smd_benchmark_machine_3_4_window20.yaml
model_config_path: configs/model/thesis_multitask_two_stage_window20.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_benchmark_fixed_synth.yaml
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 1
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 3
evaluation:
  vus_max_buffer_size: 10
  vus_num_thresholds: 20
logging:
  use_wandb: false
  wandb_project: bachelor-thesis-2026
  wandb_mode: disabled
  wandb_run_name: smd__thesis_multitask__benchmark-two-stage-machine_3_4__w20__seed6__smoke
  wandb_tags:
  - benchmark
  - thesis-two-stage
  - smd
  - machine_3_4
  - smoke
  log_hard_prediction_ratio: false
  log_row_normalized_confusion_matrix: false
  diagnostics_stages_for_classification:
  - train
  - val_synth
two_stage:
  expected_total_training_epochs: 3
  stage_a_multitask_epochs: 2
  stage_b_fusion_finetuning_epochs: 1
  discrete_memory_label_source: synthetic_train_labels
  freeze_encoder_and_memories_in_stage_b: true
data_overrides:
  batch_size: 8
  num_workers: 0
  max_train_windows: 16
  max_val_windows: 8
  max_test_windows: 16
