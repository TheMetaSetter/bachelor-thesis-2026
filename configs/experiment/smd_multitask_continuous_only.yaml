# Advanced-loss ablation config, not the default thesis starting point.
# Use this only after the simple reconstruction-plus-classification objective
# has been validated and you want to compare a continuous-only limiting case.
experiment_name: smd_multitask_continuous_only
seed: 7
device: cpu
output_dir: outputs/smd_multitask_continuous_only
checkpoint_dir: outputs/smd_multitask_continuous_only/checkpoints
data_config_path: configs/data/smd.yaml
model_config_path: configs/model/thesis_multitask.yaml
task_config_path: configs/task/multitask_tsad.yaml
# These regularizers are intentionally enabled for the ablation suite.
model_overrides:
  lambda_div: 0.01
  lambda_var: 0.01
  lambda_cov: 0.01
  lambda_use: 0.01
  lambda_gate: 0.01
task_overrides:
  freeze_fusion_for_epochs: 3
  warmup_alpha_value: 0.0
  warmup_beta_value: 0.0
optimizer:
  learning_rate: 0.001
  weight_decay: 0.0
epochs: 3
