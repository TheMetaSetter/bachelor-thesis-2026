experiment_name: smd_thesis_multitask_redlamp_multiclass_window20_recon_diag_quick_100ep
seed: 11
device: cuda
output_dir: outputs/smd_thesis_multitask_redlamp_multiclass_window20_recon_diag_quick_100ep
checkpoint_dir: outputs/smd_thesis_multitask_redlamp_multiclass_window20_recon_diag_quick_100ep/checkpoints
data_config_path: configs/data/smd_rtx3090_machine_2_1_20.yaml
model_config_path: configs/model/thesis_multitask_redlamp_multiclass.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20.yaml
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: reduce_on_plateau
    monitor_metric: val_synth_vus_pr
    factor: 0.5
    patience: 15
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-6
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 100
evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 200
logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_mode: online
  diagnostics_stages_for_classification: [train, val_synth]
  log_hard_prediction_ratio: true
  log_row_normalized_confusion_matrix: true
  focus_metrics:
    - epoch
    - train_loss
    - train_reconstruction_loss
    - train_classification_loss
    - train_weighted_f1
    - train_forward_pass_seconds_mean
    - val_loss
    - val_reconstruction_loss
    - val_synth_loss
    - val_synth_reconstruction_loss
    - val_synth_classification_loss
    - val_synth_vus_pr
    - val_synth_weighted_f1
    - val_synth_forward_pass_seconds_mean
  log_focused_metrics_jsonl: true
  focused_metrics_filename: focused_metrics.jsonl
  enable_reconstruction_diagnostics: true
  diagnostics_log_interval_steps: 1
  diagnostics_include_grad_norm: true
  wandb_tags:
    - smd
    - redlamp_multiclass
    - window20
    - recon_diag
    - quick
    - 100ep
  wandb_run_name: smd_thesis_multitask_redlamp_multiclass_window20_recon_diag_quick_100ep
model_overrides:
  bootstrap_encoder_epochs: 0
  enable_two_view_contrastive: true
  contrastive_temperature: 0.1
  lambda_contrastive: 1.0
  enable_cka_gated_fusion: true
  cka_eps: 1.0e-6
