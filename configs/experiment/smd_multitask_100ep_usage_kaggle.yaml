experiment_name: smd_multitask_100ep_usage_kaggle
seed: 7
device: cuda
output_dir: /kaggle/working/outputs/smd_multitask_100ep_usage_kaggle
checkpoint_dir: /kaggle/working/outputs/smd_multitask_100ep_usage_kaggle/checkpoints
data_config_path: configs/data/smd.yaml
model_config_path: configs/model/thesis_multitask.yaml
task_config_path: configs/task/multitask_tsad.yaml

data_overrides:
  # This default works when the Kaggle dataset slug matches the path below.
  # If your mounted path differs, set SMD_ROOT_DIR before launching training.
  root_dir: /kaggle/input/server-machine-dataset/ServerMachineDataset
  batch_size: 512
  num_workers: auto
  min_num_workers: 4

model_overrides:
  enable_usage_loss: true
  lambda_use: 0.01

optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 5
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_realistic_vus_pr
epochs: 100

logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_entity: themetasetter-i-h-c-qu-c-gia-tp-hcm
  wandb_mode: online
  wandb_tags:
    - smd
    - multitask
    - offline
    - 100ep
    - usage
    - kaggle
  wandb_run_name: smd_multitask_100ep_usage_kaggle
