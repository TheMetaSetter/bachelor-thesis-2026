experiment_name: smd_multitask_rtx3090_seed23
seed: 23
device: cuda
output_dir: outputs/smd_multitask_rtx3090_seed23
checkpoint_dir: outputs/smd_multitask_rtx3090_seed23/checkpoints
data_config_path: configs/data/smd_rtx3090_512.yaml
model_config_path: configs/model/thesis_multitask.yaml
task_config_path: configs/task/multitask_tsad.yaml
model_overrides:
  temperature_hold_fraction: 0.15
  usage_lambda_start: 0.06
  usage_lambda_end: 0.03
  usage_lambda_schedule_fraction: 0.3
optimizer:
  learning_rate: 0.001
  weight_decay: 0.0
  scheduler:
    scheduler_name: reduce_on_plateau
    monitor_metric: val_loss
    factor: 0.5
    patience: 20
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 3
    min_lr: 1.0e-5
epochs: 300
logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_entity: themetasetter-i-h-c-qu-c-gia-tp-hcm
  wandb_mode: online
  wandb_tags:
    - smd
    - multitask
    - offline
    - rtx3090
    - usage-stabilized
    - 300ep
    - lr-scheduler
    - mlp-depth-3
    - seed-23
  wandb_run_name: smd_multitask_rtx3090_seed23_300ep
