method: redlamp
variant: default
phases:
- offline
- online
parameters:
  classifier_hidden_size: 32
  classifier_dropout: 0.1
  label_correction:
    alpha: 0.1
    beta: 0.01
  classification_weight: 0.1
  class_selection_probability: 0.05
  zero_range_epsilon: 1.0e-08
training:
  stages:
  - name: fit
    epochs: 30
    optimizer:
      name: adam
      learning_rate: 0.001
      weight_decay: 0.0
      betas:
      - 0.9
      - 0.999
      epsilon: 1.0e-08
    monitor: validation_total_loss
    gradient_clip_norm: null
    scheduler: null
update: null
required_offline_variant: default
