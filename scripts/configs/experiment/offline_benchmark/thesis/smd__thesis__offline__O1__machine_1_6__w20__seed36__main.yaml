experiment_name: smd__thesis__offline__O1__machine_1_6__w20__seed36__main
seed: 36
experiment_variant: two_stage_point_score_supervised_v1
device: cuda
output_dir: outputs/benchmark/smd/thesis/O1/machine_1_6/seed36
checkpoint_dir: outputs/benchmark/smd/thesis/O1/machine_1_6/seed36/checkpoints
data_config_path: configs/data/smd_benchmark_machine_1_6_window20.yaml
model_config_path: configs/model/thesis_multitask_two_stage_window20.yaml
task_config_path: configs/task/multitask_tsad_redlamp_multiclass_window20_benchmark_fixed_synth.yaml
optimizer:
  optimizer_name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 0.5
  scheduler:
    scheduler_name: cosine
    warmup_epochs: 5
    warmup_start_lr: 0.001
    cosine_end_lr: 0.0
    cosine_after_warmup: true
checkpoint_monitor_metric: val_synth_vus_pr
epochs: 30
evaluation:
  vus_max_buffer_size: 20
  vus_num_thresholds: 200
logging:
  use_wandb: true
  wandb_project: bachelor-thesis-2026
  wandb_mode: online
  wandb_run_name: smd__thesis__offline__O1__machine_1_6__w20__seed36__main
  wandb_tags:
  - offline-benchmark
  - thesis
  - o1
  - machine_1_6
  - seed36
  - window20
  log_hard_prediction_ratio: true
  log_row_normalized_confusion_matrix: true
  diagnostics_stages_for_classification:
  - train
  - val_synth
two_stage:
  expected_total_training_epochs: 30
  stage_a_multitask_epochs: 25
  stage_b_fusion_finetuning_epochs: 5
  discrete_memory_label_source: synthetic_train_labels
  freeze_encoder_and_memories_in_stage_b: true
model_overrides:
  enable_score_loss: true
  score_loss_granularity: point
  score_loss_type: pointwise_balanced_bce_logits
  score_loss_target: synthetic_anomaly_mask
  score_loss_normalization: train_batch_normal_tokens_detached_mean_std
  score_loss_reduction: pointwise_binary_balanced_mean
